name: CMake Multi-Platform Build and Release

on:
  push:
    branches: [ "master", "experimental", "v10" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "experimental", "v10" ]
  workflow_dispatch:

jobs:
  linux-appimage:
    name: Linux AppImage (Clang)
    # libjxl-dev is not available from the Ubuntu 22.04 runner repositories.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang ninja-build pkg-config \
          libboost-filesystem-dev libboost-locale-dev libboost-regex-dev \
          libspdlog-dev libfmt-dev libfuse3-dev libjxl-dev libxcb-cursor0 \
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
          libswscale-dev

    # Ubuntu 24.04 ships libjpeg-turbo 2.x, while 12-bit CinemaDNG support
    # uses the unified 8/12-bit API provided by libjpeg-turbo 3.x. Install the
    # same pinned vcpkg port used by the other platform builds, but keep
    # manifest mode disabled so the remaining Linux dependencies stay native.
    - name: Set up vcpkg for libjpeg-turbo
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 0bab79f3c6bc9cbe867686df00b108c0c0e9c274

    - name: Install libjpeg-turbo via vcpkg
      shell: bash
      run: "$VCPKG_ROOT/vcpkg install libjpeg-turbo:x64-linux --classic --clean-after-build"

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: "6.7.2"
        host: linux
        target: desktop
        modules: qtmultimedia

    - name: Configure with LLVM
      shell: bash
      run: |
        cmake -S . -B build-linux -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DVCPKG_MANIFEST_MODE=OFF

    - name: Build
      run: cmake --build build-linux --parallel

    - name: Test
      continue-on-error: true
      run: ctest --test-dir build-linux --output-on-failure

    - name: Create AppImage
      shell: bash
      run: |
        set -euxo pipefail
        DESTDIR="$PWD/AppDir" cmake --install build-linux --prefix /usr --strip
        install -Dm644 packaging/linux/com.motioncam.fuse.desktop \
          AppDir/usr/share/applications/com.motioncam.fuse.desktop
        install -Dm644 assets/app_icon_linux.png \
          AppDir/usr/share/icons/hicolor/256x256/apps/motioncam-fuse.png
        curl -L --retry 3 -o linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        curl -L --retry 3 -o linuxdeploy-plugin-qt.AppImage \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
        export LINUXDEPLOY_PLUGIN_QT_PATH="$PWD/linuxdeploy-plugin-qt.AppImage"
        export VERSION="${GITHUB_REF_NAME#v}"
        ./linuxdeploy.AppImage --appimage-extract-and-run \
          --appdir AppDir \
          --desktop-file packaging/linux/com.motioncam.fuse.desktop \
          --icon-file assets/app_icon_linux.png \
          --plugin qt \
          --output appimage
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        mv MotionCam_Fuse-*.AppImage artifacts/motioncam-${ref_safe}-linux-x86_64.AppImage

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-Linux-AppImage
        path: artifacts/*.AppImage

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_type: Release
            build_dir: build-windows
            qt_arch: win64_msvc2019_64
            vcpkg_triplet: x64-windows
            artifact_suffix: windows-x86_64
          - os: macos-15-intel
            platform: macos
            build_type: Release
            build_dir: build-macos-x86
            mac_arch: x86_64
            qt_arch: clang_64
            vcpkg_triplet: x64-osx
            artifact_suffix: macos-x86_64
            qt_version: 6.7.2
            qt_install: aqt
            macos_target: "15.0"
          - os: macos-15
            platform: macos
            build_type: Release
            build_dir: build-macos-arm64
            mac_arch: arm64
            qt_arch: clang_arm64
            vcpkg_triplet: arm64-osx
            artifact_suffix: macos-arm64
            qt_version: 6.7.2
            qt_install: brew
            macos_target: "15.0"

    steps:
    # ---------- CHECKOUT ----------
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---------- CACHE ----------
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          ~/Library/Caches/Homebrew
          ${{ matrix.build_dir }}/
        key: ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', '.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-

    # ---------- QT ----------
    - name: Install Qt (Windows)
      if: matrix.platform == 'windows'
      uses: jurplel/install-qt-action@v3
      with:
        version: "6.7.2"
        host: windows
        target: desktop
        arch: ${{ matrix.qt_arch }}
        modules: qtmultimedia

    - name: Install Qt (macOS via aqt)
      if: matrix.qt_install == 'aqt'
      uses: jurplel/install-qt-action@v3
      with:
        version: "${{ matrix.qt_version }}"
        host: mac
        target: desktop
        arch: ${{ matrix.qt_arch }}
        modules: qtmultimedia
        set-env: true

    - name: Install Qt (macOS arm64 via Homebrew)
      if: matrix.qt_install == 'brew'
      shell: bash
      run: |
        set -euxo pipefail
        brew install qt@6
        echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

    # ---------- VCPKG ----------
    - name: Install spdlog via vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        # Keep the ports and tool version reproducible. The action's old
        # implicit snapshot referenced MSYS2 archives that are no longer
        # available, which prevented libjxl's dependencies from installing.
        vcpkgGitCommitId: 0bab79f3c6bc9cbe867686df00b108c0c0e9c274
        vcpkgArguments: spdlog
        vcpkgTriplet: ${{ matrix.vcpkg_triplet }}

    # ---------- MACOS DEPENDENCIES ----------
    - name: Install macOS build tools
      if: matrix.platform == 'macos'
      run: brew install nasm

    - name: Install macFUSE (macOS)
      if: matrix.platform == 'macos'
      run: brew install --cask macfuse

    # The Intel runner has an unowned ABI-80 jpeglib.h in /usr/local/include,
    # while vcpkg's libjpeg-turbo library and headers use ABI 62.
    - name: Hide system JPEG header (macOS Intel)
      if: matrix.platform == 'macos' && matrix.mac_arch == 'x86_64'
      run: |
        if [ -e /usr/local/include/jpeglib.h ]; then
          sudo mv /usr/local/include/jpeglib.h /tmp/jpeglib.h.runner
        fi

    # ---------- CONFIGURE ----------
    - name: Clean build directory (macOS)
      if: matrix.platform == 'macos'
      shell: bash
      run: rm -rf "${{ matrix.build_dir }}"

    - name: Configure CMake (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        # Manifest installation reuses the restored build directory cache.
        $env:VCPKG_BINARY_SOURCES = "clear"
        cmake -S . -B ${{ matrix.build_dir }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_VERBOSE_MAKEFILE=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.7.2/${{ matrix.qt_arch }}" `
          -Dprojected-fs="C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/um/x64/ProjectedFSLib.lib"

    - name: Configure CMake (macOS)
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        export VCPKG_BINARY_SOURCES=clear
        BREW_PREFIX="$(brew --prefix)"
        FUSE_LIB=""
        for candidate in "$BREW_PREFIX/lib/libfuse.2.dylib" "/usr/local/lib/libfuse.2.dylib" "/opt/homebrew/lib/libfuse.2.dylib"; do
          if [ -f "$candidate" ]; then
            FUSE_LIB="$candidate"
            break
          fi
        done
        if [ -z "$FUSE_LIB" ]; then
          echo "macFUSE libfuse.2.dylib not found"
          exit 1
        fi
        QT_PREFIX="${Qt6_ROOT_DIR:-${Qt6_DIR:-}}"
        if [ -z "$QT_PREFIX" ] || [ ! -d "$QT_PREFIX" ]; then
          if [ -d "${GITHUB_WORKSPACE}/Qt/${{ matrix.qt_version }}/macos" ]; then
            QT_PREFIX="${GITHUB_WORKSPACE}/Qt/${{ matrix.qt_version }}/macos"
          else
            QT_PREFIX="$(brew --prefix qt@6)"
          fi
        fi
        # Do not add the whole Homebrew prefix to CMake's dependency search.
        # Intel Homebrew can provide an ABI-80 jpeglib.h in /usr/local while
        # the vcpkg libjpeg-turbo archive uses ABI 62. Mixing the two only
        # shows up at runtime in jpeg_Create*(). Qt and macFUSE are located
        # explicitly, and all other manifest dependencies come from vcpkg.
        VCPKG_PREFIX="${GITHUB_WORKSPACE}/${{ matrix.build_dir }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}"
        cmake -S . -B "${{ matrix.build_dir }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DVCPKG_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }} \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.mac_arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }} \
          -DCMAKE_IGNORE_PREFIX_PATH="$BREW_PREFIX" \
          -DQt6_DIR="$QT_PREFIX/lib/cmake/Qt6" \
          -DJPEG_ROOT="$VCPKG_PREFIX" \
          -DFUSE_T_FRAMEWORK="$FUSE_LIB"


    # ---------- BUILD ----------
    - name: Build
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --parallel

    - name: Test
      if: matrix.platform == 'macos'
      continue-on-error: true
      run: ctest --test-dir "${{ matrix.build_dir }}" -C ${{ matrix.build_type }} --output-on-failure



    # ---------- PACKAGE ----------
    - name: Package binaries
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
          cd "${{ matrix.build_dir }}/${{ matrix.build_type }}"
          exe=$(find . -maxdepth 1 -type f -name "*.exe" -print -quit)
          if [ -z "$exe" ]; then
            echo "No Windows executable found in $PWD" >&2
            exit 1
          fi
          echo "Running windeployqt on $exe"
          "${{ github.workspace }}/Qt/6.7.2/${{ matrix.qt_arch }}/bin/windeployqt.exe" "$exe" || echo "windeployqt failed"
          7z a ../../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip ./*
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          cd "${{ matrix.build_dir }}"
          app=$(find . -name "*.app" -print -quit)
          if [ -z "$app" ]; then
            echo "No macOS app bundle found in $PWD" >&2
            exit 1
          fi
          echo "Packaging $app"
          bash "${{ github.workspace }}/scripts/package_macos_app.sh" "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip"
        else
          echo "Unsupported packaging platform: ${{ matrix.platform }}" >&2
          exit 1
        fi

    # ---------- UPLOAD ----------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-${{ matrix.artifact_suffix }}
        path: artifacts/*

  # ---------- RELEASE ----------
  release:
    name: Create GitHub Release
    needs: [build, linux-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          tag_name: ${{ github.ref_name }}
          name: "MotionCam-FS ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
