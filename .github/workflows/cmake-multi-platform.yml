name: CMake Multi-Platform Build and Release

on:
  push:
    branches: [ "master", "experimental", "v10" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "experimental", "v10" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.12.0'
  VCPKG_COMMIT: b1c0e26466f37efd4112bf7c1f88f5a8e28c510e

jobs:
  android-apk:
    outputs:
      portable-tests: ${{ format('{0}:{1}', steps.test-build.outcome, steps.portable-tests.outcome) }}
    name: Android APK (arm64) and tests (x86_64)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install Android platform and NDK
      shell: bash
      run: |
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not set}}"
        for attempt in 1 2 3; do
          if sdkmanager --sdk_root="$sdk_root" \
              'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then exit 1; fi
          echo "::warning::Android SDK installation failed (attempt $attempt); retrying with fresh downloads"
          # sdkmanager stages downloads/extraction here. Do not reuse an
          # incomplete ZIP after a transient download or extraction failure.
          rm -rf -- "$sdk_root/.temp"
          sleep "$((attempt * 5))"
        done

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool nasm p7zip-full

    - name: Install host Qt
      id: host-qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: linux
        target: desktop

    - name: Install Android Qt
      run: python3 scripts/install_qt_android.py "$PWD/Qt/${{ env.QT_VERSION }}/android_arm64_v8a"

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

    - name: Configure CMake (Android arm64)
      shell: bash
      env:
        QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
        QT_HOST_PATH: ${{ steps.host-qt.outputs.qt-root-dir }}
      run: |
        export ANDROID_SDK_ROOT="${ANDROID_HOME}"
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/27.2.12479018"
        BUILD_TESTING=OFF bash scripts/build_android_apk.sh "$PWD/build-android-arm64" configure

    - name: Build APK
      run: |
        cmake --build build-android-arm64 --target MotionCamFuse --parallel 4
        cmake --build build-android-arm64 --target apk --parallel 4

    - name: Package APK
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        bash scripts/sign_android_apk.sh \
          build-android-arm64/android-build/build/outputs/apk/release/android-build-release-unsigned.apk \
          "artifacts/motioncam-${ref_safe}-android-arm64.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        path: artifacts/*.apk
        archive: false
        if-no-files-found: error

    - name: Install Android Qt (x86_64)
      continue-on-error: true
      run: python3 scripts/install_qt_android.py "$PWD/Qt/${{ env.QT_VERSION }}/android_x86_64" x86_64

    - name: Configure CMake (Android tests)
      continue-on-error: true
      shell: bash
      env:
        QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/android_x86_64
        QT_HOST_PATH: ${{ steps.host-qt.outputs.qt-root-dir }}
        QT_ANDROID_ABI: x86_64
        ANDROID_VCPKG_TRIPLET: x64-android-release
        BUILD_TESTING: 'ON'
      run: |
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
        bash scripts/build_android_apk.sh "$PWD/build-android-tests" configure

    - name: Build portable tests
      id: test-build
      continue-on-error: true
      shell: bash
      run: |
        cmake --build build-android-tests --parallel 4 --target motioncam-portable-tests

    - name: Build device tests (advisory)
      continue-on-error: true
      run: cmake --build build-android-tests --target motioncam-device-tests --parallel 4

    - name: Enable emulator acceleration
      continue-on-error: true
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Test portable suite
      id: portable-tests
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        disk-size: 8G
        disable-animations: true
        script: |
          python3 tests/android_ctest.py deploy build-android-tests Qt/${{ env.QT_VERSION }}/android_x86_64 "$ANDROID_HOME/ndk/27.2.12479018"
          ctest --test-dir build-android-tests -C Release -LE '^portable$' --output-on-failure --timeout 300 || echo '::warning::Device Android tests failed (advisory)'
          ctest --test-dir build-android-tests -C Release -L '^portable$' --output-on-failure --no-tests=error --timeout 300


  linux-appimage:
    outputs:
      x86_64: ${{ matrix.arch == 'x86_64' && format('{0}:{1}', steps.test-build.outcome, steps.portable-tests.outcome) || '' }}
      aarch64: ${{ matrix.arch == 'aarch64' && format('{0}:{1}', steps.test-build.outcome, steps.portable-tests.outcome) || '' }}
    name: Linux AppImage (${{ matrix.arch }}, Clang)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
            triplet: x64-linux-release
          - os: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            triplet: arm64-linux-release
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang ninja-build pkg-config nasm autoconf automake libtool \
          libfuse3-dev libxcb-cursor0 libgl1-mesa-dev 7zip \
          libdrm-dev \
          libx11-dev libxrandr-dev libwayland-dev libxkbcommon-dev libx11-xcb-dev xvfb xauth

    # Use the same manifest, version pins and local libplacebo overlay as
    # Windows/macOS/Android. Classic mode ignores the project's registry and
    # overlay configuration and can select incompatible FFmpeg versions.
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

    - name: Install Qt
      id: qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: ${{ matrix.qt_host }}
        target: desktop
        arch: ${{ matrix.qt_arch }}
        modules: qtmultimedia

    - name: Configure with LLVM
      id: linux-configure
      shell: bash
      run: |
        export PKG_CONFIG_PATH="$PWD/build-linux/vcpkg_installed/${{ matrix.triplet }}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        # The pinned vcpkg pkgconf port has system search paths only for x64.
        # Use the native tool for system FUSE, retaining vcpkg metadata first.
        /usr/bin/pkg-config --exists fuse3
        cmake -S . -B build-linux -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DQt6_DIR="${{ steps.qt.outputs.qt-root-dir }}/lib/cmake/Qt6" \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
          -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
          -DVCPKG_OVERLAY_TRIPLETS="$PWD/scripts/vcpkg-triplets" \
          -DVCPKG_MANIFEST_MODE=ON \
          -DBUILD_TESTING=ON \
          -DMOTIONCAM_REQUIRE_VULKAN=ON \
          -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config \
          -DPKG_CONFIG_ARGN=--static

    - name: Upload Linux dependency failure logs
      if: failure() && steps.linux-configure.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-Linux-${{ matrix.arch }}-dependency-logs
        if-no-files-found: ignore
        path: |
          build-linux/vcpkg-manifest-install.log
          vcpkg/buildtrees/ffmpeg/*.log

    - name: Build runtime
      run: cmake --build build-linux --config Release --target MotionCamFuse motioncam-hardware-video-decoder-test --parallel

    - name: Check Linux hardware decoder coverage
      run: ctest --test-dir build-linux -R '^motioncam-hardware-video-decoder-test$' --output-on-failure --no-tests=error

    - name: Build portable tests
      id: test-build
      continue-on-error: true
      run: cmake --build build-linux --config Release --target motioncam-portable-tests --parallel

    - name: Build device tests (advisory)
      continue-on-error: true
      run: cmake --build build-linux --config Release --target motioncam-device-tests --parallel 4

    - name: Test portable suite
      id: portable-tests
      continue-on-error: true
      run: ctest --test-dir build-linux -L '^portable$' --output-on-failure --no-tests=error --timeout 300

    - name: Test device suite (advisory)
      continue-on-error: true
      run: ctest --test-dir build-linux -LE '^portable$' --output-on-failure --timeout 300


    - name: Create AppImage
      shell: bash
      run: |
        set -euxo pipefail
        DESTDIR="$PWD/AppDir" cmake --install build-linux --prefix /usr --strip
        install -Dm644 packaging/linux/com.motioncam.fuse.desktop \
          AppDir/usr/share/applications/com.motioncam.fuse.desktop
        install -Dm644 assets/app_icon_linux.png \
          AppDir/usr/share/icons/hicolor/256x256/apps/motioncam-fuse.png
        # Ubuntu's 7zip package exposes /usr/bin/7z as a wrapper around the
        # real binary. Bundle the binary itself so it also works in the AppImage.
        install -Dm755 /usr/lib/7zip/7z AppDir/usr/bin/7z
        curl -L --retry 3 -o linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
        curl -L --retry 3 -o linuxdeploy-plugin-qt.AppImage \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage
        chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
        export APPIMAGE_EXTRACT_AND_RUN=1
        export QMAKE="${{ steps.qt.outputs.qt-root-dir }}/bin/qmake"
        export LINUXDEPLOY_PLUGIN_QT_PATH="$PWD/linuxdeploy-plugin-qt.AppImage"
        export VERSION="${GITHUB_REF_NAME#v}"
        # vcpkg's shared VA-API libraries live outside the system loader paths.
        export LD_LIBRARY_PATH="$PWD/build-linux/vcpkg_installed/${{ matrix.triplet }}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        # linuxdeploy includes xcb by default. Include native Wayland and its
        # dynamically loaded integration plugins as well; linuxdeploy resolves
        # dependencies of the copied plugins during deployment.
        export EXTRA_PLATFORM_PLUGINS="libqwayland.so"
        qt_plugins="$("$QMAKE" -query QT_INSTALL_PLUGINS)"
        mkdir -p AppDir/usr/plugins
        for group in iconengines wayland-decoration-client wayland-graphics-integration-client wayland-shell-integration; do
          cp -a "$qt_plugins/$group" AppDir/usr/plugins/
        done
        ./linuxdeploy.AppImage --appimage-extract-and-run \
          --appdir AppDir \
          --desktop-file packaging/linux/com.motioncam.fuse.desktop \
          --icon-file assets/app_icon_linux.png \
          --plugin qt
        # Qt opens the unversioned Vulkan name. Without this alias it can load
        # the host loader alongside the bundled SONAME used by libplacebo,
        # then fail to resolve surface functions for the foreign instance.
        test -f AppDir/usr/lib/libvulkan.so.1
        ln -sf libvulkan.so.1 AppDir/usr/lib/libvulkan.so
        ./linuxdeploy.AppImage --appimage-extract-and-run \
          --appdir AppDir --output appimage
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        mv MotionCam_Fuse-*.AppImage artifacts/motioncam-${ref_safe}-linux-${{ matrix.arch }}.AppImage

    - name: Check packaged Linux display backends
      shell: bash
      run: |
        set -euxo pipefail
        test -f AppDir/usr/plugins/platforms/libqxcb.so
        test -f AppDir/usr/plugins/platforms/libqwayland.so
        test -f AppDir/usr/plugins/iconengines/libqsvgicon.so
        test "$(readlink -f AppDir/usr/lib/libvulkan.so)" = \
             "$(readlink -f AppDir/usr/lib/libvulkan.so.1)"
        # Test the deployed runtime and libraries without requiring a GPU.
        export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib"
        export QT_PLUGIN_PATH="$PWD/AppDir/usr/plugins"
        xvfb-run -a env QT_QPA_PLATFORM=xcb AppDir/usr/bin/MotionCamFuse --help
        # A missing Wayland compositor must fall back to the X11 display.
        xvfb-run -a env -u QT_QPA_PLATFORM XDG_SESSION_TYPE=wayland \
          WAYLAND_DISPLAY=motioncam-missing-compositor AppDir/usr/bin/MotionCamFuse --help

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        path: artifacts/*.AppImage
        archive: false
        if-no-files-found: error


  build:
    outputs:
      windows-x86_64: ${{ matrix.artifact_suffix == 'windows-x86_64' && format('{0}:{1}', steps.test-build.outcome, steps.portable-tests.outcome) || '' }}
      macos-x86_64: ${{ matrix.artifact_suffix == 'macos-x86_64' && format('{0}:{1}', steps.test-build.outcome, steps.portable-tests.outcome) || '' }}
      macos-arm64: ${{ matrix.artifact_suffix == 'macos-arm64' && format('{0}:{1}', steps.test-build.outcome, steps.portable-tests.outcome) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_type: Release
            build_dir: build-windows
            vcpkg_triplet: x64-windows-release
            artifact_suffix: windows-x86_64
          - os: macos-15-intel
            platform: macos
            build_type: Release
            build_dir: build-macos-x86
            mac_arch: x86_64
            vcpkg_triplet: x64-osx-release
            artifact_suffix: macos-x86_64
            macos_target: "15.0"
          - os: macos-15
            platform: macos
            build_type: Release
            build_dir: build-macos-arm64
            mac_arch: arm64
            vcpkg_triplet: arm64-osx-release
            artifact_suffix: macos-arm64
            macos_target: "15.0"

    steps:
    # ---------- CHECKOUT ----------
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---------- CACHE ----------
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          ${{ matrix.build_dir }}/
        key: ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', 'scripts/vcpkg-triplets/**', '.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-

    # ---------- QT ----------
    - name: Set up Python (Windows Qt installer)
      if: matrix.platform == 'windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # aqt 3.3 does not resolve Qt 6.12's split MSVC repository layout.
    - name: Install Qt (Windows archives)
      id: qt-windows
      if: matrix.platform == 'windows'
      shell: pwsh
      run: python scripts/install_qt.py windows "$env:GITHUB_WORKSPACE/Qt/$env:QT_VERSION/msvc2022_64"

    - name: Install Qt
      id: qt
      if: matrix.platform == 'macos'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: mac
        target: desktop
        arch: clang_64
        modules: qtmultimedia
        extra: --timeout 60

    # ---------- VCPKG ----------
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        # Keep the ports and tool version reproducible. The action's old
        # implicit snapshot referenced MSYS2 archives that are no longer
        # available, which prevented libjxl's dependencies from installing.
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

    # ---------- MACOS DEPENDENCIES ----------
    - name: Install macOS build tools
      if: matrix.platform == 'macos'
      run: brew install nasm sevenzip pkgconf molten-vk

    - name: Install macFUSE (macOS)
      if: matrix.platform == 'macos'
      run: brew install --cask macfuse

    # The Intel runner has an unowned ABI-80 jpeglib.h in /usr/local/include,
    # while vcpkg's libjpeg-turbo library and headers use ABI 62.
    - name: Hide system JPEG header (macOS Intel)
      if: matrix.platform == 'macos' && matrix.mac_arch == 'x86_64'
      run: |
        if [ -e /usr/local/include/jpeglib.h ]; then
          sudo mv /usr/local/include/jpeglib.h /tmp/jpeglib.h.runner
        fi

    # ---------- CONFIGURE ----------
    - name: Clean build directory (macOS)
      if: matrix.platform == 'macos'
      shell: bash
      run: rm -rf "${{ matrix.build_dir }}"

    - name: Configure CMake (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        # Manifest installation reuses the restored build directory cache.
        $env:VCPKG_BINARY_SOURCES = "clear"
        ./scripts/build_windows.ps1 -Compiler MSVC -Phase Configure `
          -BuildType ${{ matrix.build_type }} -BuildDirectory ${{ matrix.build_dir }} `
          -QtPath "${{ steps.qt-windows.outputs.qt-root-dir }}"

    - name: Configure CMake (macOS)
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        export VCPKG_BINARY_SOURCES=clear
        BREW_PREFIX="$(brew --prefix)"
        FUSE_LIB=""
        for candidate in "$BREW_PREFIX/lib/libfuse.2.dylib" "/usr/local/lib/libfuse.2.dylib" "/opt/homebrew/lib/libfuse.2.dylib"; do
          if [ -f "$candidate" ]; then
            FUSE_LIB="$candidate"
            break
          fi
        done
        if [ -z "$FUSE_LIB" ]; then
          echo "macFUSE libfuse.2.dylib not found"
          exit 1
        fi
        QT_PREFIX="${{ steps.qt.outputs.qt-root-dir }}"
        test -f "$QT_PREFIX/lib/cmake/Qt6/Qt6Config.cmake"
        # Do not add the whole Homebrew prefix to CMake's dependency search.
        # Intel Homebrew can provide an ABI-80 jpeglib.h in /usr/local while
        # the vcpkg libjpeg-turbo archive uses ABI 62. Mixing the two only
        # shows up at runtime in jpeg_Create*(). Qt and macFUSE are located
        # explicitly, and all other manifest dependencies come from vcpkg.
        VCPKG_PREFIX="${GITHUB_WORKSPACE}/${{ matrix.build_dir }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}"
        cmake -S . -B "${{ matrix.build_dir }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DBUILD_TESTING=ON \
          -DMOTIONCAM_REQUIRE_VULKAN=ON \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DVCPKG_HOST_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DVCPKG_OVERLAY_TRIPLETS="$PWD/scripts/vcpkg-triplets" \
          -DVCPKG_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }} \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.mac_arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }} \
          -DCMAKE_IGNORE_PREFIX_PATH="$BREW_PREFIX" \
          -DQt6_DIR="$QT_PREFIX/lib/cmake/Qt6" \
          -DMOTIONCAM_MOLTENVK_LIBRARY="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" \
          -DJPEG_ROOT="$VCPKG_PREFIX" \
          -DFUSE_T_FRAMEWORK="$FUSE_LIB"


    # ---------- BUILD ----------
    # Test failures preserve build artifacts; the portable-tests job gates prereleases.
    - name: Build runtime
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --target MotionCamFuse motioncam-hardware-video-decoder-test --parallel

    - name: Check platform hardware decoder coverage
      run: ctest --test-dir "${{ matrix.build_dir }}" -C ${{ matrix.build_type }} -R '^motioncam-hardware-video-decoder-test$' --output-on-failure --no-tests=error

    - name: Build portable tests
      id: test-build
      continue-on-error: true
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --target motioncam-portable-tests --parallel

    - name: Build device tests (advisory)
      continue-on-error: true
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --target motioncam-device-tests --parallel 4

    - name: Test portable suite
      id: portable-tests
      continue-on-error: true
      run: ctest --test-dir "${{ matrix.build_dir }}" -C ${{ matrix.build_type }} -L '^portable$' --output-on-failure --no-tests=error --timeout 300

    - name: Test device suite (advisory)
      continue-on-error: true
      run: ctest --test-dir "${{ matrix.build_dir }}" -C ${{ matrix.build_type }} -LE '^portable$' --output-on-failure --timeout 300




    # ---------- PACKAGE ----------
    - name: Package binaries
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
          cd "${{ matrix.build_dir }}/${{ matrix.build_type }}"
          exe=./MotionCamFuse.exe
          if [ ! -f "$exe" ]; then
            echo "No Windows executable found in $PWD" >&2
            exit 1
          fi
          echo "Running windeployqt on $exe"
          # Keep the hardware-enabled FFmpeg DLLs copied by vcpkg. Qt 6.12
          # bundles the same DLL names and must not replace that tested build.
          windeployqt.exe --release --no-ffmpeg "$exe"
          ./motioncam-hardware-video-decoder-test.exe
          sevenzip_dir="$(dirname "$(command -v 7z)")"
          cp "$sevenzip_dir/7z.exe" .
          if [ -f "$sevenzip_dir/7z.dll" ]; then cp "$sevenzip_dir/7z.dll" .; fi
          7z a ../../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip ./*
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          cd "${{ matrix.build_dir }}"
          app=$(find . -name "*.app" -print -quit)
          if [ -z "$app" ]; then
            echo "No macOS app bundle found in $PWD" >&2
            exit 1
          fi
          echo "Packaging $app"
          mkdir -p ../debug-symbols
          dsymutil "$app/Contents/MacOS/MotionCamFuse" -o MotionCamFuse.dSYM
          ditto -c -k --keepParent MotionCamFuse.dSYM \
            "../debug-symbols/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}-symbols.zip"
          cp "$(command -v 7zz)" "$app/Contents/MacOS/7zz"
          bash "${{ github.workspace }}/scripts/package_macos_app.sh" "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip"
        else
          echo "Unsupported packaging platform: ${{ matrix.platform }}" >&2
          exit 1
        fi

    # ---------- UPLOAD ----------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-${{ matrix.artifact_suffix }}
        path: artifacts/*

    # Keep crash symbols available for this run, outside the motioncam-* set
    # downloaded by the prerelease job.
    - name: Upload macOS debug symbols
      if: matrix.platform == 'macos'
      uses: actions/upload-artifact@v4
      with:
        name: debug-symbols-${{ matrix.artifact_suffix }}
        path: debug-symbols/*.zip
        if-no-files-found: error


  # Device tests are compiled and run as advisory checks.
  # Build jobs publish artifacts even if tests fail. Check each platform's
  # original step outcomes here (continue-on-error changes conclusions only).
  portable-tests:
    name: Require portable tests on every platform
    needs: [build, linux-appimage, android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform passed test compilation and portable tests
        shell: python
        env:
          ANDROID_TESTS: ${{ needs.android-apk.outputs.portable-tests }}
          LINUX_X86_TESTS: ${{ needs.linux-appimage.outputs.x86_64 }}
          LINUX_ARM_TESTS: ${{ needs.linux-appimage.outputs.aarch64 }}
          WINDOWS_TESTS: ${{ needs.build.outputs.windows-x86_64 }}
          MACOS_INTEL_TESTS: ${{ needs.build.outputs.macos-x86_64 }}
          MACOS_ARM_TESTS: ${{ needs.build.outputs.macos-arm64 }}
        run: |
          import os
          platforms = ("ANDROID_TESTS", "LINUX_X86_TESTS", "LINUX_ARM_TESTS", "WINDOWS_TESTS",
                       "MACOS_INTEL_TESTS", "MACOS_ARM_TESTS")
          failures = [f"{platform}: {os.environ.get(platform) or 'missing result'}"
                      for platform in platforms
                      if os.environ.get(platform) != "success:success"]
          if failures:
              raise SystemExit("Portable test gate failed:\n" + "\n".join(failures))

  # ---------- PRERELEASE ----------
  prerelease:
    name: Create GitHub prerelease
    needs: [build, linux-appimage, android-apk, portable-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'branch'
    permissions:
      contents: write
    steps:
      - name: Checkout commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine prerelease version
        id: version
        shell: bash
        run: |
          commit_count=$(git rev-list --count "$GITHUB_SHA")
          printf 'version=0.10.%s\n' "$commit_count" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files/
          pattern: motioncam-*

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          fail_on_unmatched_files: true
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "MotionCam-FS ${{ steps.version.outputs.version }}"
          prerelease: true
          make_latest: false
          body: |
            Automated build of `${{ github.ref_name }}` at `${{ github.sha }}`.
            All platform builds and portable tests passed.

            [Build and test results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
