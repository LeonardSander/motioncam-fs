name: CMake Multi-Platform Build and Release

on:
  push:
    branches: [ "master", "experimental", "v10" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "experimental", "v10" ]
  workflow_dispatch:

jobs:
  android-apk:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Install Android platform and NDK
      shell: bash
      run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool nasm p7zip-full

    - name: Install host Qt
      id: host-qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.12.0'
        host: linux
        target: desktop

    - name: Install Android Qt
      run: python3 scripts/install_qt_android.py "$PWD/Qt/6.12.0/android_arm64_v8a"

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 0bab79f3c6bc9cbe867686df00b108c0c0e9c274

    - name: Configure CMake (Android arm64)
      shell: bash
      env:
        QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/6.12.0/android_arm64_v8a
        QT_HOST_PATH: ${{ steps.host-qt.outputs.qt-root-dir }}
      run: |
        export ANDROID_SDK_ROOT="${ANDROID_HOME}"
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/27.2.12479018"
        BUILD_TESTING=ON bash scripts/build_android_apk.sh "$PWD/build-android-arm64" configure

    - name: Build APK and test binaries
      run: |
        cmake --build build-android-arm64 --parallel 4
        cmake --build build-android-arm64 --target apk --parallel 4

    - name: Package APK
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        apk="$(find build-android-arm64 -type f -name '*.apk' -path '*/outputs/apk/*' -print -quit)"
        test -n "$apk"
        cp "$apk" "artifacts/motioncam-${ref_safe}-android-arm64.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-android-arm64
        path: artifacts/*.apk

  android-tests:
    name: Android tests (x86_64 emulator)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform and NDK
      run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf automake libtool nasm p7zip-full

    - name: Install host Qt
      id: host-qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.12.0'
        host: linux
        target: desktop

    - name: Install Android Qt (x86_64)
      run: python3 scripts/install_qt_android.py "$PWD/Qt/6.12.0/android_x86_64" x86_64

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 0bab79f3c6bc9cbe867686df00b108c0c0e9c274

    - name: Configure CMake (Android tests)
      shell: bash
      env:
        QT_ANDROID_ROOT: ${{ github.workspace }}/Qt/6.12.0/android_x86_64
        QT_HOST_PATH: ${{ steps.host-qt.outputs.qt-root-dir }}
        QT_ANDROID_ABI: x86_64
        ANDROID_VCPKG_TRIPLET: x64-android
        BUILD_TESTING: 'ON'
      run: |
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
        bash scripts/build_android_apk.sh "$PWD/build-android-tests" configure

    - name: Build tests
      run: cmake --build build-android-tests --parallel 4

    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Test
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: default
        disk-size: 8G
        disable-animations: true
        script: |
          python3 tests/android_ctest.py deploy build-android-tests Qt/6.12.0/android_x86_64 "$ANDROID_HOME/ndk/27.2.12479018"
          ctest --test-dir build-android-tests -C Release --output-on-failure --no-tests=error --timeout 300 --output-junit test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-android
        path: |
          build-android-tests/test-results.xml
          build-android-tests/Testing/Temporary/LastTest.log
        if-no-files-found: ignore

  linux-appimage:
    name: Linux AppImage (Clang)
    # libjxl-dev is not available from the Ubuntu 22.04 runner repositories.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install native build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang ninja-build pkg-config nasm autoconf automake libtool \
          libboost-filesystem-dev libboost-locale-dev libboost-regex-dev \
          libspdlog-dev libfmt-dev libfuse3-dev libjxl-dev libxcb-cursor0 \
          libarchive-dev 7zip libx11-dev libxrandr-dev libwayland-dev \
          libxkbcommon-dev libx11-xcb-dev \
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
          libswscale-dev

    # Ubuntu 24.04 ships libjpeg-turbo 2.x, while 12-bit CinemaDNG support
    # uses the unified 8/12-bit API provided by libjpeg-turbo 3.x. Install the
    # pinned vcpkg processing libraries used by the other platforms. Keeping
    # libplacebo and FFmpeg together also enables the Vulkan tests on Linux.
    - name: Set up vcpkg for processing dependencies
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 0bab79f3c6bc9cbe867686df00b108c0c0e9c274

    - name: Install processing dependencies via vcpkg
      shell: bash
      run: |
        "$VCPKG_ROOT/vcpkg" install --classic --clean-after-build \
          libjpeg-turbo:x64-linux libplacebo:x64-linux \
          'ffmpeg[avcodec,avfilter,avformat,swresample,swscale]:x64-linux'

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: "6.7.2"
        host: linux
        target: desktop
        modules: qtmultimedia

    - name: Configure with LLVM
      shell: bash
      run: |
        export PKG_CONFIG_PATH="$VCPKG_ROOT/installed/x64-linux/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        cmake -S . -B build-linux -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DVCPKG_MANIFEST_MODE=OFF \
          -DBUILD_TESTING=ON \
          -DMOTIONCAM_REQUIRE_VULKAN=ON \
          -DPKG_CONFIG_ARGN=--static

    - name: Build
      run: cmake --build build-linux --parallel

    - name: Test
      continue-on-error: true
      run: ctest --test-dir build-linux --output-on-failure --no-tests=error --timeout 300 --output-junit test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux
        path: |
          build-linux/test-results.xml
          build-linux/Testing/Temporary/LastTest.log
          build-linux/gallery-overlay-*.png
        if-no-files-found: ignore

    - name: Create AppImage
      shell: bash
      run: |
        set -euxo pipefail
        DESTDIR="$PWD/AppDir" cmake --install build-linux --prefix /usr --strip
        install -Dm644 packaging/linux/com.motioncam.fuse.desktop \
          AppDir/usr/share/applications/com.motioncam.fuse.desktop
        install -Dm644 assets/app_icon_linux.png \
          AppDir/usr/share/icons/hicolor/256x256/apps/motioncam-fuse.png
        # Ubuntu's 7zip package exposes /usr/bin/7z as a wrapper around the
        # real binary. Bundle the binary itself so it also works in the AppImage.
        install -Dm755 /usr/lib/7zip/7z AppDir/usr/bin/7z
        curl -L --retry 3 -o linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        curl -L --retry 3 -o linuxdeploy-plugin-qt.AppImage \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
        export LINUXDEPLOY_PLUGIN_QT_PATH="$PWD/linuxdeploy-plugin-qt.AppImage"
        export VERSION="${GITHUB_REF_NAME#v}"
        ./linuxdeploy.AppImage --appimage-extract-and-run \
          --appdir AppDir \
          --desktop-file packaging/linux/com.motioncam.fuse.desktop \
          --icon-file assets/app_icon_linux.png \
          --plugin qt \
          --output appimage
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        mv MotionCam_Fuse-*.AppImage artifacts/motioncam-${ref_safe}-linux-x86_64.AppImage

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-Linux-AppImage
        path: artifacts/*.AppImage

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_type: Release
            build_dir: build-windows
            qt_arch: win64_msvc2019_64
            vcpkg_triplet: x64-windows
            artifact_suffix: windows-x86_64
          - os: macos-15-intel
            platform: macos
            build_type: Release
            build_dir: build-macos-x86
            mac_arch: x86_64
            qt_arch: clang_64
            vcpkg_triplet: x64-osx
            artifact_suffix: macos-x86_64
            qt_version: 6.7.2
            qt_install: aqt
            macos_target: "15.0"
          - os: macos-15
            platform: macos
            build_type: Release
            build_dir: build-macos-arm64
            mac_arch: arm64
            qt_arch: clang_arm64
            vcpkg_triplet: arm64-osx
            artifact_suffix: macos-arm64
            qt_version: 6.7.2
            qt_install: brew
            macos_target: "15.0"

    steps:
    # ---------- CHECKOUT ----------
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ---------- CACHE ----------
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          ${{ matrix.build_dir }}/
        key: ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', '.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.vcpkg_triplet }}-deps-

    # ---------- QT ----------
    - name: Install Qt (Windows)
      if: matrix.platform == 'windows'
      uses: jurplel/install-qt-action@v3
      with:
        version: "6.7.2"
        host: windows
        target: desktop
        arch: ${{ matrix.qt_arch }}
        modules: qtmultimedia

    - name: Install Qt (macOS via aqt)
      if: matrix.qt_install == 'aqt'
      uses: jurplel/install-qt-action@v3
      with:
        version: "${{ matrix.qt_version }}"
        host: mac
        target: desktop
        arch: ${{ matrix.qt_arch }}
        modules: qtmultimedia
        set-env: true
        extra: --timeout 60

    - name: Install Qt (macOS arm64 via Homebrew)
      if: matrix.qt_install == 'brew'
      shell: bash
      run: |
        set -euxo pipefail
        # The runner's OpenSSL 4 links conflict with Qt's OpenSSL 3 dependency.
        # Unlink first so Homebrew does not try to back up/overwrite them.
        if brew list --versions openssl@4 >/dev/null 2>&1; then
          brew unlink openssl@4
        fi
        brew install qt@6
        echo "$(brew --prefix qt@6)/bin" >> "$GITHUB_PATH"

    # ---------- VCPKG ----------
    - name: Install spdlog via vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        # Keep the ports and tool version reproducible. The action's old
        # implicit snapshot referenced MSYS2 archives that are no longer
        # available, which prevented libjxl's dependencies from installing.
        vcpkgGitCommitId: 0bab79f3c6bc9cbe867686df00b108c0c0e9c274
        vcpkgArguments: spdlog
        vcpkgTriplet: ${{ matrix.vcpkg_triplet }}

    # ---------- MACOS DEPENDENCIES ----------
    - name: Install macOS build tools
      if: matrix.platform == 'macos'
      run: brew install nasm sevenzip pkgconf molten-vk

    - name: Install macFUSE (macOS)
      if: matrix.platform == 'macos'
      run: brew install --cask macfuse

    # The Intel runner has an unowned ABI-80 jpeglib.h in /usr/local/include,
    # while vcpkg's libjpeg-turbo library and headers use ABI 62.
    - name: Hide system JPEG header (macOS Intel)
      if: matrix.platform == 'macos' && matrix.mac_arch == 'x86_64'
      run: |
        if [ -e /usr/local/include/jpeglib.h ]; then
          sudo mv /usr/local/include/jpeglib.h /tmp/jpeglib.h.runner
        fi

    # ---------- CONFIGURE ----------
    - name: Clean build directory (macOS)
      if: matrix.platform == 'macos'
      shell: bash
      run: rm -rf "${{ matrix.build_dir }}"

    - name: Configure CMake (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        # Manifest installation reuses the restored build directory cache.
        $env:VCPKG_BINARY_SOURCES = "clear"
        cmake -S . -B ${{ matrix.build_dir }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_VERBOSE_MAKEFILE=ON `
          -DBUILD_TESTING=ON `
          -DMOTIONCAM_REQUIRE_VULKAN=ON `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.7.2/${{ matrix.qt_arch }}" `
          -Dprojected-fs="C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/um/x64/ProjectedFSLib.lib"

    - name: Configure CMake (macOS)
      if: matrix.platform == 'macos'
      shell: bash
      run: |
        export VCPKG_BINARY_SOURCES=clear
        BREW_PREFIX="$(brew --prefix)"
        FUSE_LIB=""
        for candidate in "$BREW_PREFIX/lib/libfuse.2.dylib" "/usr/local/lib/libfuse.2.dylib" "/opt/homebrew/lib/libfuse.2.dylib"; do
          if [ -f "$candidate" ]; then
            FUSE_LIB="$candidate"
            break
          fi
        done
        if [ -z "$FUSE_LIB" ]; then
          echo "macFUSE libfuse.2.dylib not found"
          exit 1
        fi
        QT_PREFIX="${Qt6_ROOT_DIR:-${Qt6_DIR:-}}"
        if [ -z "$QT_PREFIX" ] || [ ! -d "$QT_PREFIX" ]; then
          if [ -d "${GITHUB_WORKSPACE}/Qt/${{ matrix.qt_version }}/macos" ]; then
            QT_PREFIX="${GITHUB_WORKSPACE}/Qt/${{ matrix.qt_version }}/macos"
          else
            QT_PREFIX="$(brew --prefix qt@6)"
          fi
        fi
        # Do not add the whole Homebrew prefix to CMake's dependency search.
        # Intel Homebrew can provide an ABI-80 jpeglib.h in /usr/local while
        # the vcpkg libjpeg-turbo archive uses ABI 62. Mixing the two only
        # shows up at runtime in jpeg_Create*(). Qt and macFUSE are located
        # explicitly, and all other manifest dependencies come from vcpkg.
        VCPKG_PREFIX="${GITHUB_WORKSPACE}/${{ matrix.build_dir }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}"
        cmake -S . -B "${{ matrix.build_dir }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DBUILD_TESTING=ON \
          -DMOTIONCAM_REQUIRE_VULKAN=ON \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DVCPKG_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }} \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.mac_arch }} \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }} \
          -DCMAKE_IGNORE_PREFIX_PATH="$BREW_PREFIX" \
          -DQt6_DIR="$QT_PREFIX/lib/cmake/Qt6" \
          -DMOTIONCAM_MOLTENVK_LIBRARY="$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" \
          -DJPEG_ROOT="$VCPKG_PREFIX" \
          -DFUSE_T_FRAMEWORK="$FUSE_LIB"


    # ---------- BUILD ----------
    - name: Build
      run: cmake --build "${{ matrix.build_dir }}" --config ${{ matrix.build_type }} --parallel

    - name: Test
      continue-on-error: true
      run: ctest --test-dir "${{ matrix.build_dir }}" -C ${{ matrix.build_type }} --output-on-failure --no-tests=error --timeout 300 --output-junit test-results.xml



    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.artifact_suffix }}
        path: |
          ${{ matrix.build_dir }}/test-results.xml
          ${{ matrix.build_dir }}/Testing/Temporary/LastTest.log
          ${{ matrix.build_dir }}/gallery-overlay-*.png
        if-no-files-found: ignore

    # ---------- PACKAGE ----------
    - name: Package binaries
      shell: bash
      run: |
        mkdir -p artifacts
        ref_safe="${GITHUB_REF_NAME//\//-}"
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
          cd "${{ matrix.build_dir }}/${{ matrix.build_type }}"
          exe=$(find . -maxdepth 1 -type f -name "*.exe" -print -quit)
          if [ -z "$exe" ]; then
            echo "No Windows executable found in $PWD" >&2
            exit 1
          fi
          echo "Running windeployqt on $exe"
          "${{ github.workspace }}/Qt/6.7.2/${{ matrix.qt_arch }}/bin/windeployqt.exe" "$exe" || echo "windeployqt failed"
          sevenzip_dir="$(dirname "$(command -v 7z)")"
          cp "$sevenzip_dir/7z.exe" .
          if [ -f "$sevenzip_dir/7z.dll" ]; then cp "$sevenzip_dir/7z.dll" .; fi
          7z a ../../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip ./*
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          cd "${{ matrix.build_dir }}"
          app=$(find . -name "*.app" -print -quit)
          if [ -z "$app" ]; then
            echo "No macOS app bundle found in $PWD" >&2
            exit 1
          fi
          echo "Packaging $app"
          cp "$(command -v 7zz)" "$app/Contents/MacOS/7zz"
          bash "${{ github.workspace }}/scripts/package_macos_app.sh" "$app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "../artifacts/motioncam-${ref_safe}-${{ matrix.artifact_suffix }}.zip"
        else
          echo "Unsupported packaging platform: ${{ matrix.platform }}" >&2
          exit 1
        fi

    # ---------- UPLOAD ----------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: motioncam-${{ matrix.artifact_suffix }}
        path: artifacts/*

  # ---------- RELEASE ----------
  release:
    name: Create GitHub Release
    needs: [build, linux-appimage, android-apk, android-tests]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files/
          pattern: motioncam-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          tag_name: ${{ github.ref_name }}
          name: "MotionCam-FS ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
